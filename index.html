<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobile Project Solution Hub - Products</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --secondary: #06b6d4;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --dark: #0f172a;
            --gray: #64748b;
            --light: #f8fafc;
            --card-bg: #ffffff;
            --body-bg: linear-gradient(135deg, #eef2ff 0%, #e0e7ff 50%, #f0f9ff 100%);
            --shadow: 0 10px 40px rgba(79, 70, 229, 0.08);
            --shadow-hover: 0 20px 50px rgba(79, 70, 229, 0.15);
            --border: #e2e8f0;
        }

        [data-theme="dark"] {
            --dark: #f1f5f9;
            --gray: #94a3b8;
            --light: #1e293b;
            --card-bg: #1e293b;
            --body-bg: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            --shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            --shadow-hover: 0 20px 50px rgba(99, 102, 241, 0.2);
            --border: #334155;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Poppins', sans-serif;
            background: var(--body-bg);
            background-attachment: fixed;
            padding: 15px;
            color: var(--dark);
            min-height: 100vh;
            transition: background 0.4s ease, color 0.4s ease;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            animation: fadeInUp 0.6s ease;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        header {
            background: var(--card-bg);
            padding: 25px 30px;
            border-radius: 24px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            margin-bottom: 25px;
            position: relative;
            text-align: center;
        }

        header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 4px;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            border-radius: 0 0 4px 4px;
        }

        h1 {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: 800;
            font-size: 26px;
            letter-spacing: -0.5px;
            margin-bottom: 10px;
        }

        .creator-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: linear-gradient(135deg, #e0e7ff, #cffafe);
            color: var(--primary-dark);
            padding: 8px 18px;
            border-radius: 50px;
            font-size: 13px;
            font-weight: 600;
            border: 1px solid rgba(99, 102, 241, 0.2);
        }

        [data-theme="dark"] .creator-badge {
            background: linear-gradient(135deg, #312e81, #164e63);
            color: #c7d2fe;
        }

        .creator-badge a {
            color: var(--success);
            text-decoration: none;
            font-weight: 700;
        }

        .theme-toggle {
            position: absolute;
            top: 20px;
            right: 20px;
            background: var(--light);
            border: 1px solid var(--border);
            width: 42px;
            height: 42px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .theme-toggle:hover {
            transform: rotate(20deg) scale(1.1);
            background: var(--primary);
        }

        /* ===== DEBUG STATUS BAR ===== */
        .status-bar {
            background: var(--card-bg);
            padding: 12px 18px;
            border-radius: 14px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            font-size: 13px;
        }

        .status-item {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 12px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 12px;
        }

        .status-ok {
            background: rgba(16, 185, 129, 0.15);
            color: var(--success);
        }

        .status-error {
            background: rgba(239, 68, 68, 0.15);
            color: var(--danger);
        }

        .status-info {
            background: rgba(99, 102, 241, 0.15);
            color: var(--primary);
        }

        /* ===== TOOLBAR ===== */
        .toolbar {
            background: var(--card-bg);
            padding: 18px 20px;
            border-radius: 18px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            margin-bottom: 25px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            align-items: center;
        }

        .search-box {
            flex: 1;
            min-width: 200px;
            position: relative;
        }

        .search-box input {
            width: 100%;
            padding: 12px 16px 12px 42px;
            border: 2px solid var(--border);
            border-radius: 12px;
            background: var(--light);
            color: var(--dark);
            font-family: 'Poppins', sans-serif;
            font-size: 14px;
            outline: none;
            transition: all 0.3s ease;
        }

        .search-box input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1);
        }

        .search-box::before {
            content: '🔍';
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 16px;
        }

        .filter-select {
            padding: 12px 16px;
            border: 2px solid var(--border);
            border-radius: 12px;
            background: var(--light);
            color: var(--dark);
            font-family: 'Poppins', sans-serif;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            outline: none;
            transition: all 0.3s ease;
            min-width: 150px;
        }

        .live-badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            font-size: 11px;
            background: rgba(16, 185, 129, 0.15);
            color: var(--success);
            padding: 5px 12px;
            border-radius: 20px;
            font-weight: 600;
        }

        .live-dot {
            width: 7px;
            height: 7px;
            background: var(--success);
            border-radius: 50%;
            animation: livePulse 1.5s infinite;
        }

        @keyframes livePulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.3); }
        }

        /* ===== PRODUCT GRID ===== */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 20px;
            margin-bottom: 25px;
        }

        .product-card {
            background: var(--card-bg);
            border-radius: 18px;
            overflow: hidden;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            position: relative;
            animation: fadeInUp 0.4s ease;
        }

        .product-card:hover {
            transform: translateY(-6px);
            box-shadow: var(--shadow-hover);
            border-color: var(--primary);
        }

        .product-image-wrapper {
            position: relative;
            width: 100%;
            height: 200px;
            overflow: hidden;
            background: linear-gradient(135deg, #e0e7ff, #cffafe);
            cursor: zoom-in;
        }

        [data-theme="dark"] .product-image-wrapper {
            background: linear-gradient(135deg, #312e81, #164e63);
        }

        .product-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .product-card:hover .product-image {
            transform: scale(1.08);
        }

        .product-image-fallback {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 60px;
            opacity: 0.5;
        }

        .image-zoom-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
        }

        .product-image-wrapper:hover .image-zoom-overlay {
            opacity: 1;
        }

        .image-zoom-overlay span {
            color: white;
            font-size: 40px;
            transform: scale(0.7);
            transition: transform 0.3s ease;
        }

        .product-image-wrapper:hover .image-zoom-overlay span {
            transform: scale(1);
        }

        .badge {
            position: absolute;
            top: 12px;
            left: 12px;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            z-index: 2;
        }

        .badge-featured {
            background: linear-gradient(135deg, var(--warning), #d97706);
            color: white;
            box-shadow: 0 4px 12px rgba(245, 158, 11, 0.4);
        }

        .badge-outstock {
            background: linear-gradient(135deg, var(--danger), #b91c1c);
            color: white;
            position: absolute;
            top: 12px;
            right: 12px;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 10px;
            font-weight: 700;
            z-index: 2;
        }

        .discount-badge {
            position: absolute;
            bottom: 12px;
            right: 12px;
            background: linear-gradient(135deg, var(--success), #059669);
            color: white;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            z-index: 2;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.4);
        }

        .product-body {
            padding: 16px;
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .product-category {
            font-size: 11px;
            color: var(--primary);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin-bottom: 6px;
        }

        .product-name {
            font-size: 16px;
            font-weight: 700;
            color: var(--dark);
            margin-bottom: 8px;
            line-height: 1.3;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .product-desc {
            font-size: 13px;
            color: var(--gray);
            line-height: 1.5;
            margin-bottom: 12px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            flex: 1;
        }

        .product-price-row {
            display: flex;
            align-items: baseline;
            gap: 8px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }

        .product-price {
            font-size: 20px;
            font-weight: 800;
            color: var(--success);
        }

        .product-original-price {
            font-size: 13px;
            color: var(--gray);
            text-decoration: line-through;
        }

        .btn-order {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            width: 100%;
            background: linear-gradient(135deg, #25D366, #128C7E);
            color: white;
            padding: 11px;
            border: none;
            border-radius: 10px;
            font-family: 'Poppins', sans-serif;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .btn-order:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(37, 211, 102, 0.4);
        }

        .btn-order:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
            background: var(--gray);
        }

        /* ===== LOADING & EMPTY ===== */
        .loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 60px 20px;
            gap: 15px;
            grid-column: 1 / -1;
        }

        .spinner {
            width: 45px;
            height: 45px;
            border: 4px solid var(--border);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading p {
            font-size: 14px;
            color: var(--gray);
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--gray);
            grid-column: 1 / -1;
            background: var(--card-bg);
            border-radius: 18px;
            border: 2px dashed var(--border);
        }

        .empty-state .emoji {
            font-size: 60px;
            display: block;
            margin-bottom: 15px;
        }

        .empty-state h3 {
            color: var(--dark);
            margin-bottom: 8px;
            font-size: 18px;
        }

        .empty-state p {
            font-size: 14px;
            margin-bottom: 12px;
        }

        .empty-state .btn {
            max-width: 250px;
            margin: 0 auto;
        }

        /* ===== BUTTONS ===== */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            background: linear-gradient(135deg, var(--success), #059669);
            color: white;
            text-align: center;
            padding: 13px;
            border: none;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            font-family: 'Poppins', sans-serif;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(16, 185, 129, 0.3);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .btn-admin-toggle {
            background: linear-gradient(135deg, var(--warning), #d97706);
            color: #1e293b;
        }

        .btn-danger { background: linear-gradient(135deg, var(--danger), #b91c1c); }
        .btn-secondary { background: linear-gradient(135deg, #64748b, #475569); }

        /* ===== ADMIN PANEL ===== */
        #adminPanel {
            display: none;
            background: linear-gradient(135deg, #fffbeb, #fef3c7);
            border: 2px dashed var(--warning);
            padding: 25px;
            border-radius: 18px;
            margin-bottom: 25px;
            animation: fadeInUp 0.4s ease;
        }

        [data-theme="dark"] #adminPanel {
            background: linear-gradient(135deg, #422006, #713f12);
        }

        #adminPanel h3 {
            color: var(--warning);
            border-bottom: 2px solid #fde68a;
            padding-bottom: 10px;
            margin-bottom: 18px;
            font-size: 17px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group.full { grid-column: 1 / -1; }

        label {
            font-size: 12px;
            font-weight: 600;
            color: var(--dark);
            margin-bottom: 5px;
        }

        input, textarea, select {
            width: 100%;
            padding: 11px 14px;
            border: 2px solid var(--border);
            border-radius: 10px;
            font-family: 'Poppins', sans-serif;
            font-size: 13px;
            background: var(--card-bg);
            color: var(--dark);
            transition: all 0.3s ease;
            outline: none;
        }

        input:focus, textarea:focus, select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1);
        }

        .checkbox-row {
            display: flex;
            gap: 20px;
            align-items: center;
            flex-wrap: wrap;
            margin: 8px 0 14px;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            font-weight: 500;
        }

        .checkbox-item input[type="checkbox"] {
            width: auto;
            margin: 0;
            cursor: pointer;
        }

        /* ===== LIGHTBOX ===== */
        .lightbox {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.95);
            z-index: 10000;
            display: none;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.35s ease;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            touch-action: none;
            user-select: none;
        }

        .lightbox.active {
            display: flex;
            opacity: 1;
        }

        .lightbox-image-container {
            position: relative;
            max-width: 90vw;
            max-height: 85vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .lightbox-image {
            max-width: 90vw;
            max-height: 85vh;
            object-fit: contain;
            border-radius: 12px;
            box-shadow: 0 20px 80px rgba(0, 0, 0, 0.5);
            transition: transform 0.3s ease;
            transform-origin: center center;
            cursor: zoom-in;
            animation: lightboxZoomIn 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        .lightbox-image.zoomed { cursor: zoom-out; }

        @keyframes lightboxZoomIn {
            from { transform: scale(0.7); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .lightbox-topbar {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            padding: 20px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
            background: linear-gradient(to bottom, rgba(0,0,0,0.7), transparent);
        }

        .lightbox-counter {
            color: white;
            font-size: 14px;
            font-weight: 600;
            background: rgba(255, 255, 255, 0.15);
            padding: 8px 16px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
        }

        .lightbox-close {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.15);
            border: none;
            color: white;
            font-size: 22px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .lightbox-close:hover {
            background: var(--danger);
            transform: rotate(90deg) scale(1.1);
        }

        .lightbox-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 54px;
            height: 54px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.15);
            border: none;
            color: white;
            font-size: 24px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            z-index: 10;
        }

        .lightbox-nav:hover {
            background: var(--primary);
            transform: translateY(-50%) scale(1.15);
        }

        .lightbox-nav:disabled {
            opacity: 0.2;
            cursor: not-allowed;
        }

        .lightbox-prev { left: 24px; }
        .lightbox-next { right: 24px; }

        .lightbox-bottombar {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 20px 24px;
            display: flex;
            justify-content: center;
            gap: 12px;
            z-index: 10;
            background: linear-gradient(to top, rgba(0,0,0,0.7), transparent);
        }

        .lightbox-action {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.15);
            border: none;
            color: white;
            font-family: 'Poppins', sans-serif;
            font-size: 13px;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            text-decoration: none;
        }

        .lightbox-action:hover {
            background: var(--primary);
            transform: translateY(-2px);
        }

        .lightbox-caption {
            position: absolute;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            font-size: 14px;
            font-weight: 500;
            background: rgba(0, 0, 0, 0.5);
            padding: 8px 20px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            max-width: 80%;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* ===== TOAST ===== */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            padding: 14px 24px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 500;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            z-index: 9999;
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            max-width: 90%;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .toast.success { background: linear-gradient(135deg, var(--success), #059669); color: white; }
        .toast.error { background: linear-gradient(135deg, var(--danger), #b91c1c); color: white; }
        .toast.info { background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: white; }

        /* ===== FLOATING WHATSAPP ===== */
        .float-wa {
            position: fixed;
            bottom: 25px;
            right: 25px;
            width: 58px;
            height: 58px;
            background: linear-gradient(135deg, #25D366, #128C7E);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            color: white;
            text-decoration: none;
            box-shadow: 0 8px 25px rgba(37, 211, 102, 0.4);
            z-index: 999;
            transition: all 0.3s ease;
            animation: pulse 2s infinite;
        }

        .float-wa:hover { transform: scale(1.1) rotate(10deg); }

        @keyframes pulse {
            0%, 100% { box-shadow: 0 8px 25px rgba(37, 211, 102, 0.4); }
            50% { box-shadow: 0 8px 35px rgba(37, 211, 102, 0.7); }
        }

        @media (max-width: 640px) {
            body { padding: 10px; }
            h1 { font-size: 20px; }
            .creator-badge { font-size: 11px; padding: 6px 12px; }
            .form-grid { grid-template-columns: 1fr; }
            .products-grid { grid-template-columns: 1fr; }
            .toolbar { padding: 14px; }
            .theme-toggle { width: 36px; height: 36px; font-size: 15px; }
            .lightbox-nav { width: 44px; height: 44px; font-size: 20px; }
            .lightbox-prev { left: 12px; }
            .lightbox-next { right: 12px; }
            .lightbox-close { width: 40px; height: 40px; font-size: 20px; }
            .lightbox-topbar { padding: 15px 16px; }
            .lightbox-bottombar { padding: 15px 16px; }
            .lightbox-action { padding: 8px 14px; font-size: 12px; }
            .lightbox-caption { bottom: 75px; font-size: 12px; }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <button class="theme-toggle" onclick="toggleTheme()" title="Theme">🌙</button>
        <h1>🛍️ Mobile Project Solution Hub</h1>
        <div class="creator-badge">
            👨‍💻 <strong>Tamir Ali</strong> | 
            <a href="https://wa.me/918797221991" target="_blank">📱 +91 8797221991</a>
        </div>
    </header>

    <!-- ===== DEBUG STATUS BAR ===== -->
    <div class="status-bar" id="statusBar">
        <span class="status-item status-info">🔥 Firebase: <span id="firebaseStatus">Connecting...</span></span>
        <span class="status-item status-info">📦 Products: <span id="productCount">0</span></span>
        <span class="status-item status-info" id="lastUpdate">⏳ Loading...</span>
        <button onclick="forceReload()" style="margin-left:auto; padding:6px 14px; border:none; background:var(--primary); color:white; border-radius:8px; cursor:pointer; font-size:12px; font-weight:600;">🔄 Reload</button>
    </div>

    <div class="toolbar">
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Product search karein..." oninput="filterProducts()">
        </div>
        <select class="filter-select" id="categoryFilter" onchange="filterProducts()">
            <option value="">Sabhi Categories</option>
            <option value="Software">Software</option>
            <option value="Hardware">Hardware</option>
            <option value="Service">Service</option>
            <option value="Accessories">Accessories</option>
            <option value="Other">Other</option>
        </select>
        <span class="live-badge"><span class="live-dot"></span>LIVE</span>
    </div>

    <!-- Admin Panel -->
    <div id="adminPanel">
        <h3>⚙️ Admin Panel - Product Management</h3>
        
        <div id="loginBox">
            <label for="adminPass">🔑 Admin Password Darj Karein:</label>
            <input type="password" id="adminPass" placeholder="Secret access code..." style="margin-bottom:12px;">
            <button class="btn" onclick="verifyAdmin()">Login Karein</button>
        </div>

        <div id="dashboardBox" style="display:none;">
            <p style="color: var(--success); font-weight: 600; margin-bottom: 15px;">✔ Admin Login Successful!</p>
            
            <div class="form-grid">
                <div class="form-group full">
                    <label>📝 Product ka Naam *</label>
                    <input type="text" id="newName" placeholder="Jaise: Kirana POS System">
                </div>
                
                <div class="form-group full">
                    <label>📄 Description *</label>
                    <textarea id="newDesc" rows="2" placeholder="Product ke baare mein likhein..."></textarea>
                </div>
                
                <div class="form-group">
                    <label>💰 Price (₹) *</label>
                    <input type="number" id="newPrice" placeholder="4999">
                </div>
                
                <div class="form-group">
                    <label>🏷️ Original Price (₹)</label>
                    <input type="number" id="newOriginalPrice" placeholder="7999">
                </div>
                
                <div class="form-group">
                    <label>📂 Category</label>
                    <select id="newCategory">
                        <option value="Software">Software</option>
                        <option value="Hardware">Hardware</option>
                        <option value="Service">Service</option>
                        <option value="Accessories">Accessories</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label>🖼️ Image URL</label>
                    <input type="text" id="newImage" placeholder="https://image-url.jpg">
                </div>
                
                <div class="form-group full">
                    <label>📱 WhatsApp Number</label>
                    <input type="text" id="newWhatsapp" placeholder="918797221991" value="918797221991">
                </div>
            </div>

            <div class="checkbox-row">
                <label class="checkbox-item">
                    <input type="checkbox" id="newFeatured"> ⭐ Featured
                </label>
                <label class="checkbox-item">
                    <input type="checkbox" id="newInStock" checked> ✔️ In Stock
                </label>
            </div>

            <button class="btn" id="addBtn" onclick="addProduct()">➕ Naya Product Add Karein</button>
            
            <div style="display:flex; gap:10px; margin-top: 10px;">
                <button class="btn btn-secondary" onclick="exitAdmin()">🚪 Logout</button>
            </div>
        </div>
    </div>

    <div class="products-grid" id="productsGrid">
        <div class="loading">
            <div class="spinner"></div>
            <p>Firebase se products load ho rahe hain...</p>
        </div>
    </div>

    <button class="btn btn-admin-toggle" onclick="toggleAdminPanel()">🔒 Admin Panel</button>
</div>

<a href="https://wa.me/918797221991" target="_blank" class="float-wa" title="WhatsApp">💬</a>
<div class="toast" id="toast"></div>

<!-- ============================================== -->
<!-- LIGHTBOX                                         -->
<!-- ============================================== -->
<div class="lightbox" id="lightbox">
    <div class="lightbox-topbar">
        <span class="lightbox-counter" id="lightboxCounter">1 / 1</span>
        <button class="lightbox-close" onclick="closeLightbox()" title="Close (ESC)">✕</button>
    </div>
    <button class="lightbox-nav lightbox-prev" onclick="prevImage()" id="prevBtn" title="Previous (←)">❮</button>
    <button class="lightbox-nav lightbox-next" onclick="nextImage()" id="nextBtn" title="Next (→)">❯</button>
    <div class="lightbox-image-container">
        <img src="" alt="" class="lightbox-image" id="lightboxImage" onclick="toggleZoom(event)">
    </div>
    <div class="lightbox-caption" id="lightboxCaption"></div>
    <div class="lightbox-bottombar">
        <button class="lightbox-action" onclick="zoomIn()" title="Zoom In">🔍➕</button>
        <button class="lightbox-action" onclick="zoomOut()" title="Zoom Out">🔍➖</button>
        <button class="lightbox-action" onclick="resetZoom()" title="Reset">🔄</button>
        <button class="lightbox-action" onclick="downloadImage()" title="Download">⬇️ Download</button>
    </div>
</div>

<!-- ============================================== -->
<!-- FIREBASE SDK                                     -->
<!-- ============================================== -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { 
        getDatabase, ref, push, set, onValue, 
        query, orderByChild 
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBvfFTKBqh0E0sS5ufpejiK_ua6gixnf5s",
        authDomain: "local-resailing.firebaseapp.com",
        databaseURL: "https://local-resailing-default-rtdb.firebaseio.com",
        projectId: "local-resailing",
        storageBucket: "local-resailing.firebasestorage.app",
        messagingSenderId: "973187455126",
        appId: "1:973187455126:web:847a608d88024595e1cab7",
        measurementId: "G-ZKP0Q91SDE"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const productsRef = ref(db, 'products');

    let allProducts = [];
    let filteredProducts = [];

    // ============================================
    // FIXED: Load products WITHOUT orderByChild
    // (Isse timestamp missing hone par bhi kaam karega)
    // ============================================
    function loadProducts() {
        updateFirebaseStatus('Connected ✔️', 'ok');
        
        // ✅ Simple onValue - koi orderByChild nahi
        onValue(productsRef, (snapshot) => {
            allProducts = [];
            
            if (snapshot.exists()) {
                snapshot.forEach((child) => {
                    const data = child.val();
                    
                    // Debug: console mein data print karein
                    console.log('📦 Product found:', child.key, data);
                    
                    // Filter out invalid entries
                    if (data && (data.name || data.title)) {
                        allProducts.push({
                            id: child.key,
                            name: data.name || data.title || 'Untitled',
                            description: data.description || data.desc || '',
                            price: data.price || 0,
                            originalPrice: data.originalPrice || 0,
                            category: data.category || 'Other',
                            image: data.image || data.imageUrl || '',
                            whatsapp: data.whatsapp || '918797221991',
                            featured: data.featured === true,
                            inStock: data.inStock !== false,
                            timestamp: data.timestamp || 0
                        });
                    }
                });
                
                // Sort by timestamp (latest first) - client side
                allProducts.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
                
                updateProductCount(allProducts.length);
                updateFirebaseStatus(`Connected ✔️ (${allProducts.length} products)`, 'ok');
                updateLastUpdate();
                
                console.log(`✅ Total ${allProducts.length} products loaded from Firebase`);
            } else {
                console.log('⚠️ No data found at "products" node');
                updateProductCount(0);
                updateFirebaseStatus('Connected - No Data', 'error');
            }
            
            filterProducts();
        }, (error) => {
            // ❌ Error handler
            console.error("❌ Firebase error:", error);
            updateFirebaseStatus('Error: ' + error.code, 'error');
            
            let errorMessage = 'Data load nahi ho paya.';
            let solution = '';
            
            if (error.code === 'PERMISSION_DENIED' || error.message.includes('permission')) {
                errorMessage = '🔒 Database Permission Denied!';
                solution = 'Firebase Console → Realtime Database → Rules mein jaakar ".read": true, ".write": true set karein.';
            } else if (error.message.includes('index')) {
                errorMessage = '📇 Database Index Missing!';
                solution = 'Firebase Console → Realtime Database → Rules mein add karein: "products": { ".indexOn": ["timestamp"] }';
            }
            
            document.getElementById('productsGrid').innerHTML = `
                <div class="empty-state">
                    <span class="emoji">⚠️</span>
                    <h3>${errorMessage}</h3>
                    <p>${solution || error.message}</p>
                    <p style="font-size:12px; margin-top:10px; opacity:0.7;">Error Code: ${error.code}</p>
                    <button class="btn" onclick="forceReload()" style="margin-top:15px;">🔄 Dobara Try Karein</button>
                </div>
            `;
        });
    }

    // ============================================
    // STATUS BAR UPDATES
    // ============================================
    function updateFirebaseStatus(text, type) {
        const el = document.getElementById('firebaseStatus');
        el.textContent = text;
        el.parentElement.className = 'status-item ' + (type === 'ok' ? 'status-ok' : 'status-error');
    }

    function updateProductCount(count) {
        document.getElementById('productCount').textContent = count;
    }

    function updateLastUpdate() {
        const now = new Date();
        document.getElementById('lastUpdate').textContent = 
            '🕒 ' + now.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    }

    window.forceReload = function() {
        document.getElementById('productsGrid').innerHTML = `
            <div class="loading">
                <div class="spinner"></div>
                <p>Reload ho raha hai...</p>
            </div>
        `;
        updateFirebaseStatus('Reloading...', 'ok');
        // Firebase onValue auto-reload karega, bas UI reset kar diya
        setTimeout(() => {
            filterProducts();
            showToast('🔄 Data reload ho gaya!', 'success');
        }, 500);
    };

    // ============================================
    // FILTER & RENDER
    // ============================================
    window.filterProducts = function() {
        const searchInput = document.getElementById('searchInput');
        const categoryFilter = document.getElementById('categoryFilter');
        
        const search = searchInput ? searchInput.value.toLowerCase().trim() : '';
        const category = categoryFilter ? categoryFilter.value : '';

        filteredProducts = allProducts.filter(p => {
            const matchSearch = !search || 
                (p.name || '').toLowerCase().includes(search) ||
                (p.description || '').toLowerCase().includes(search);
            const matchCategory = !category || p.category === category;
            return matchSearch && matchCategory;
        });

        renderProducts(filteredProducts);
    };

    function renderProducts(products) {
        const grid = document.getElementById('productsGrid');

        if (products.length === 0) {
            grid.innerHTML = `
                <div class="empty-state">
                    <span class="emoji">📭</span>
                    <h3>Koi Product Nahi Mila</h3>
                    <p>${allProducts.length === 0 
                        ? 'Firebase Database mein "products" node ke andar koi data nahi hai. Admin panel se product add karein.' 
                        : 'Search ya filter change karke dekhein.'}</p>
                    ${allProducts.length === 0 
                        ? `<button class="btn" onclick="openAdminAndAddProduct()" style="max-width:250px;margin:15px auto 0;">➕ Pehla Product Add Karein</button>`
                        : ''
                    }
                </div>
            `;
            return;
        }

        grid.innerHTML = products.map((p, index) => {
            const price = parseFloat(p.price) || 0;
            const originalPrice = parseFloat(p.originalPrice) || 0;
            const hasDiscount = originalPrice > price && originalPrice > 0;
            const discountPercent = hasDiscount 
                ? Math.round(((originalPrice - price) / originalPrice) * 100) 
                : 0;
            const inStock = p.inStock !== false;
            const waNumber = p.whatsapp || '918797221991';
            const waMessage = encodeURIComponent(`Hello, mujhe yeh product chahiye: ${p.name} (₹${price})`);
            const hasImage = p.image && p.image.trim() !== '';

            return `
                <div class="product-card">
                    <div class="product-image-wrapper" ${hasImage ? `onclick="openLightbox(${index})"` : ''}>
                        ${p.featured ? '<span class="badge badge-featured">⭐ Featured</span>' : ''}
                        ${!inStock ? '<span class="badge-outstock">Out of Stock</span>' : ''}
                        ${hasDiscount ? `<span class="discount-badge">${discountPercent}% OFF</span>` : ''}
                        ${hasImage 
                            ? `<img src="${escapeHtml(p.image)}" alt="${escapeHtml(p.name)}" class="product-image" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                               <div class="product-image-fallback" style="display:none;">📦</div>
                               <div class="image-zoom-overlay"><span>🔍</span></div>`
                            : `<div class="product-image-fallback">📦</div>`
                        }
                    </div>
                    <div class="product-body">
                        <div class="product-category">${escapeHtml(p.category || 'Other')}</div>
                        <h3 class="product-name">${escapeHtml(p.name)}</h3>
                        <p class="product-desc">${escapeHtml(p.description)}</p>
                        <div class="product-price-row">
                            <span class="product-price">₹${price.toLocaleString('en-IN')}</span>
                            ${hasDiscount ? `<span class="product-original-price">₹${originalPrice.toLocaleString('en-IN')}</span>` : ''}
                        </div>
                        ${inStock 
                            ? `<a href="https://wa.me/${waNumber}?text=${waMessage}" target="_blank" class="btn-order">💬 Order Karein</a>`
                            : `<button class="btn-order" disabled>❌ Out of Stock</button>`
                        }
                    </div>
                </div>
            `;
        }).join('');
    }

    window.openAdminAndAddProduct = function() {
        toggleAdminPanel();
        showToast('ℹ️ Admin password daalein: tamir7122', 'info');
    };

    // ============================================
    // LIGHTBOX
    // ============================================
    let currentImageIndex = 0;
    let currentZoom = 1;
    let touchStartX = 0;
    let touchEndX = 0;

    window.openLightbox = function(index) {
        const productsWithImages = filteredProducts.filter(p => p.image && p.image.trim() !== '');
        const clickedProduct = filteredProducts[index];
        const imageIndex = productsWithImages.findIndex(p => p.id === clickedProduct.id);
        
        if (imageIndex === -1) return;
        
        currentImageIndex = imageIndex;
        currentZoom = 1;
        updateLightbox();
        
        document.getElementById('lightbox').classList.add('active');
        document.body.style.overflow = 'hidden';
    };

    window.closeLightbox = function() {
        document.getElementById('lightbox').classList.remove('active');
        document.body.style.overflow = '';
        currentZoom = 1;
    };

    function updateLightbox() {
        const productsWithImages = filteredProducts.filter(p => p.image && p.image.trim() !== '');
        const product = productsWithImages[currentImageIndex];
        if (!product) return;

        const img = document.getElementById('lightboxImage');
        img.src = product.image;
        img.alt = product.name;
        img.style.transform = 'scale(1)';
        currentZoom = 1;

        document.getElementById('lightboxCaption').textContent = product.name;
        document.getElementById('lightboxCounter').textContent = 
            `${currentImageIndex + 1} / ${productsWithImages.length}`;

        document.getElementById('prevBtn').disabled = currentImageIndex === 0;
        document.getElementById('nextBtn').disabled = currentImageIndex === productsWithImages.length - 1;
    }

    window.prevImage = function() {
        if (currentImageIndex > 0) {
            currentImageIndex--;
            updateLightbox();
        }
    };

    window.nextImage = function() {
        const productsWithImages = filteredProducts.filter(p => p.image && p.image.trim() !== '');
        if (currentImageIndex < productsWithImages.length - 1) {
            currentImageIndex++;
            updateLightbox();
        }
    };

    window.toggleZoom = function() {
        currentZoom = currentZoom === 1 ? 2 : 1;
        applyZoom();
    };

    window.zoomIn = function() { if (currentZoom < 3) { currentZoom += 0.5; applyZoom(); } };
    window.zoomOut = function() { if (currentZoom > 1) { currentZoom -= 0.5; applyZoom(); } };
    window.resetZoom = function() { currentZoom = 1; applyZoom(); };

    function applyZoom() {
        const img = document.getElementById('lightboxImage');
        img.style.transform = `scale(${currentZoom})`;
        img.classList.toggle('zoomed', currentZoom > 1);
    }

    document.getElementById('lightboxImage').addEventListener('wheel', (e) => {
        e.preventDefault();
        e.deltaY < 0 ? zoomIn() : zoomOut();
    }, { passive: false });

    window.downloadImage = async function() {
        const productsWithImages = filteredProducts.filter(p => p.image && p.image.trim() !== '');
        const product = productsWithImages[currentImageIndex];
        if (!product || !product.image) return;

        try {
            const response = await fetch(product.image);
            const blob = await response.blob();
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = `${product.name.replace(/[^a-z0-9]/gi, '_')}.jpg`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
            showToast('✔ Image download ho gayi!', 'success');
        } catch (err) {
            window.open(product.image, '_blank');
            showToast('📥 Image new tab mein khul gayi.', 'info');
        }
    };

    document.addEventListener('keydown', (e) => {
        const lightbox = document.getElementById('lightbox');
        if (!lightbox.classList.contains('active')) return;
        if (e.key === 'Escape') closeLightbox();
        if (e.key === 'ArrowLeft') prevImage();
        if (e.key === 'ArrowRight') nextImage();
        if (e.key === '+' || e.key === '=') zoomIn();
        if (e.key === '-') zoomOut();
        if (e.key === '0') resetZoom();
    });

    const lightboxEl = document.getElementById('lightbox');
    lightboxEl.addEventListener('touchstart', (e) => {
        touchStartX = e.changedTouches[0].screenX;
    }, { passive: true });
    lightboxEl.addEventListener('touchend', (e) => {
        touchEndX = e.changedTouches[0].screenX;
        const diff = touchStartX - touchEndX;
        if (Math.abs(diff) < 50) return;
        diff > 0 ? nextImage() : prevImage();
    }, { passive: true });
    lightboxEl.addEventListener('click', (e) => {
        if (e.target === lightboxEl) closeLightbox();
    });

    // ============================================
    // ADD PRODUCT
    // ============================================
    window.addProduct = async function() {
        const name = document.getElementById('newName').value.trim();
        const desc = document.getElementById('newDesc').value.trim();
        const price = document.getElementById('newPrice').value.trim();
        const originalPrice = document.getElementById('newOriginalPrice').value.trim();
        const category = document.getElementById('newCategory').value;
        const image = document.getElementById('newImage').value.trim();
        const whatsapp = document.getElementById('newWhatsapp').value.trim();
        const featured = document.getElementById('newFeatured').checked;
        const inStock = document.getElementById('newInStock').checked;
        const addBtn = document.getElementById('addBtn');

        if (!name || !desc || !price) {
            showToast('⚠️ Name, Description aur Price zaroor bharein!', 'error');
            return;
        }

        addBtn.disabled = true;
        addBtn.textContent = '⏳ Save ho raha hai...';

        try {
            const newRef = push(productsRef);
            await set(newRef, {
                name, description: desc,
                price: parseFloat(price),
                originalPrice: originalPrice ? parseFloat(originalPrice) : 0,
                category, image: image || '',
                whatsapp: whatsapp || '918797221991',
                featured, inStock,
                timestamp: Date.now()  // ✅ Important - sort karne ke liye
            });

            ['newName', 'newDesc', 'newPrice', 'newOriginalPrice', 'newImage'].forEach(id => {
                document.getElementById(id).value = '';
            });
            document.getElementById('newFeatured').checked = false;
            document.getElementById('newInStock').checked = true;

            showToast('✔ Product Firebase mein add ho gaya!', 'success');
        } catch (error) {
            console.error("Write error:", error);
            let msg = '❌ Save nahi ho paya!';
            if (error.message.includes('permission')) {
                msg = '❌ Permission denied! Firebase Rules check karein.';
            }
            showToast(msg, 'error');
        } finally {
            addBtn.disabled = false;
            addBtn.textContent = '➕ Naya Product Add Karein';
        }
    };

    // ============================================
    // ADMIN PANEL
    // ============================================
    window.toggleAdminPanel = function() {
        const panel = document.getElementById('adminPanel');
        panel.style.display = panel.style.display === 'block' ? 'none' : 'block';
    };

    window.verifyAdmin = function() {
        const pass = document.getElementById('adminPass').value;
        if (pass === 'tamir7122') {
            document.getElementById('loginBox').style.display = 'none';
            document.getElementById('dashboardBox').style.display = 'block';
            showToast('✔ Admin Login Successful!', 'success');
        } else {
            showToast('❌ Galat Code!', 'error');
        }
    };

    window.exitAdmin = function() {
        document.getElementById('dashboardBox').style.display = 'none';
        document.getElementById('loginBox').style.display = 'block';
        document.getElementById('adminPass').value = '';
        document.getElementById('adminPanel').style.display = 'none';
        showToast('🚪 Logout Successful!', 'info');
    };

    // ============================================
    // UTILITIES
    // ============================================
    window.toggleTheme = function() {
        const body = document.body;
        const btn = document.querySelector('.theme-toggle');
        if (body.getAttribute('data-theme') === 'dark') {
            body.removeAttribute('data-theme');
            btn.textContent = '🌙';
            localStorage.setItem('theme', 'light');
        } else {
            body.setAttribute('data-theme', 'dark');
            btn.textContent = '☀️';
            localStorage.setItem('theme', 'dark');
        }
    };

    function showToast(message, type = 'info') {
        const toast = document.getElementById('toast');
        toast.textContent = message;
        toast.className = 'toast ' + type;
        setTimeout(() => toast.classList.add('show'), 10);
        setTimeout(() => toast.classList.remove('show'), 3500);
    }

    function escapeHtml(text) {
        if (!text) return '';
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    // ============================================
    // INIT
    // ============================================
    if (localStorage.getItem('theme') === 'dark') {
        document.body.setAttribute('data-theme', 'dark');
        document.querySelector('.theme-toggle').textContent = '☀️';
    }

    loadProducts();
    console.log('🔥 Firebase Product Hub initialized');
    console.log('📊 Database URL:', firebaseConfig.databaseURL);
    console.log('📂 Listening to: /products');
</script>

</body>
